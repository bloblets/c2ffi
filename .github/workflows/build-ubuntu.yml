name: Build c2ffi

on:
  push:
  pull_request:
  workflow_dispatch:   # enables manual runs

jobs:
  build:
    name: Build on Ubuntu
    runs-on: ubuntu-latest
    steps:

      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Build Docker image
      - name: Build Docker image
        run: |
          docker build -f Docker/Test-Build-Ubuntu-20.04.docker -t c2ffi-build:latest .

      # 3️⃣ Extract entire build folder from Docker container
      - name: Extract build folder
        run: |
          mkdir -p build
          CONTAINER_ID=$(docker create c2ffi-build:latest)
          docker cp $CONTAINER_ID:/c2ffi/build ./build
          docker rm $CONTAINER_ID

      # 4️⃣ Upload entire build folder as artifact
      - name: Upload build folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: c2ffi-build
          path: build
